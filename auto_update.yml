name: Dragon-Watch-Autopilot

on:
  schedule:
    - cron: '0 */6 * * *' # سيعمل الروبوت تلقائياً كل 6 ساعات
  workflow_dispatch: # هذا السطر يضيف لك زر "Run workflow" لتشغيله يدوياً في أي وقت

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install @supabase/supabase-js axios

      - name: Run Fetch Script
        run: node fetch-episodes.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
